
<!DOCTYPE html>
<html lang="fr-CH">


<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="styling.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="source/Website Icon.png">
  <title> EquationiX</title>
</head>
<body>


        <h1 class="main-title"><sub> <img src="source/Website Icon.png" alt="website Logo" style="width:50px;height:50px;"></sub> Equationix</h1> 
         <p class="title"> Choisis le degré: </p> 
        <select id="equations" name="equation_choice">
          <option value="1">Equation du 1er degré</option>
          <option value="2">Equation du 2e degré</option>
          <option value="3">Equation du 3e degré</option>
        </select>
        <div id="EquationFilling">

          <input type="text" id="param3" value="0">
          <label id="x3" > X<sup>3</sup> + </label>

          <input type="text" id="param2" value="0">
          <label id="x2" > X<sup>2</sup> + </label>

          <input type="text" id="param1" value="0">
          <label id="x1" > X </label>

          <label id="cons_label" > + </label>
          <input type="text" id="cons" value="0">

          <button class="button-style" onclick="Calculate()" type="button">Calculate</button>

         </div>
        <br>
        <p id="last_step">check</p>
        <p>Zéro.s: <span id="sol"></span></p>  
        
        <canvas id="myChart" style="width:100%;max-width:700px"></canvas>

           
         

        

<script src="JavaScript.js"></script>



  
</body>
</html>
